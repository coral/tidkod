name: Source validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install example audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libltc-dev
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p tidkod --example ltc_in --locked
      - run: python scripts/check_ltc_dependencies.py
      - name: Independent LTC interoperability (test executable only)
        run: |
          cargo build -p tidkod-bindings --locked
          cc -O2 -DNDEBUG -I target/debug/tidkod-generated/native scripts/ltc_reference.c -L target/debug -Wl,-rpath,"$PWD/target/debug" -ltidkod_bindings $(pkg-config --cflags --libs ltc) -o target/ltc-reference
          target/ltc-reference
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p tidkod-protocol --locked
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/smoke_examples.py
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
      - name: Validate workflows and schema
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          actionlint
          buf lint
          buf format --diff --exit-code
          buf build -o "$RUNNER_TEMP/tidkod-descriptor.bin"
          python scripts/generate_docs.py --check
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
