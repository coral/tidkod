name: Native SDK matrix
on:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform.target }} / ${{ matrix.variant }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [native, core]
        platform:
          - {runner: windows-2022, target: x86_64-pc-windows-msvc, arch: x64, msvc: amd64}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64, msvc: arm64}
          - {runner: macos-15, target: aarch64-apple-darwin, arch: arm64}
          - {runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x64}
          - {runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install example audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.platform.arch }}
      - uses: actions/setup-dotnet@v6.0.0
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.msvc }}
      - name: Workspace tests
        if: matrix.variant == 'native'
        run: cargo test --workspace --locked
      - name: Build and exercise archived SDK
        run: python scripts/sdk.py build --target ${{ matrix.platform.target }} --variant ${{ matrix.variant }}
      - name: Check audio-free SDK runtime dependencies
        run: python scripts/check_ltc_dependencies.py --target ${{ matrix.platform.target }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdk-${{ matrix.platform.target }}-${{ matrix.variant }}
          path: dist/releases/*
          if-no-files-found: error
  linux-compatibility:
    needs: desktop
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [native, core]
        platform:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sdk-${{ matrix.platform.target }}-${{ matrix.variant }}
          path: artifacts
      - name: Run consumers against the Ubuntu 22.04 archive
        shell: bash
        run: python scripts/sdk.py test artifacts/*.tar.gz
  apple:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install simulator consumer tooling
        run: brew install xcodegen
      - name: Build XCFramework and run simulator consumer
        run: python scripts/apple_sdk.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdk-apple-xcframework
          path: dist/releases/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: ios-test-results
          path: target/ios-smoke-*.xcresult
